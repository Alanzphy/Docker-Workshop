services:
  frontend:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app_network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=workshop
      - DB_USER=postgres
      - DB_PASS=postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=workshop
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # - PGDATA=/tmp/postgres-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workshop"]
      interval: 5s
      timeout: 5s
      retries: 10
    # volumes:
    #   - db-data:/var/lib/postgresql/data
    networks:
      - app_network

# Declaración explícita de la red
networks:
  app_network:
    driver: bridge

